name: MLPilot Backend Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/investigator-approval-pipeline]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python source
        run: python -m compileall -q src
      - name: Check whitespace errors
        run: git diff --check
